<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#05080f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>INATOR</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Spectral:ital,wght@0,300;0,400;1,300&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════
   INATOR — CSS FOUNDATION
═══════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  /* Lobby palette */
  --lb-bg:#05080f;
  --lb-bg2:#080d1a;
  --lb-arc:#1a6fff;
  --lb-arc2:#00c8ff;
  --lb-dim:#2a3a5c;
  --lb-txt:#8aaad4;
  --lb-txt2:#c8daf5;
  --lb-glow:rgba(26,111,255,0.18);

  /* Mission palette */
  --ms-bg:#f5f0e8;
  --ms-bg2:#ede8dc;
  --ms-gold:#c9973a;
  --ms-gold2:#e8b84b;
  --ms-gold3:#f5d47a;
  --ms-dim:#b8a88a;
  --ms-txt:#3a2e1e;
  --ms-txt2:#6b5a3e;
  --ms-paper:#faf7f2;

  --radius:14px;
  --trans:all 0.3s cubic-bezier(0.4,0,0.2,1);
}

html,body{height:100%;overflow:hidden;font-family:'Spectral',Georgia,serif}
body{background:var(--lb-bg);color:var(--lb-txt2)}
#mission,#mission *{-webkit-overflow-scrolling:touch}

/* ═══════════════════════════════════════
   SCREENS
═══════════════════════════════════════ */
.screen{position:fixed;inset:0;display:flex;flex-direction:column;
  transition:opacity 0.8s ease,transform 0.8s cubic-bezier(0.4,0,0.2,1);
  will-change:opacity,transform}
.screen.hidden{opacity:0;pointer-events:none;display:none !important}
.screen.slide-out{transform:scale(0.92) translateY(20px)}
.screen.slide-in{transform:scale(1.04) translateY(-20px)}

/* ═══════════════════════════════════════
   LOBBY SCREEN
═══════════════════════════════════════ */
#lobby{background:var(--lb-bg);overflow:hidden}

/* Animated starfield background */
.starfield{position:absolute;inset:0;overflow:hidden;z-index:0}
.star{position:absolute;border-radius:50%;animation:twinkle var(--d,3s) ease-in-out infinite var(--delay,0s)}
@keyframes twinkle{0%,100%{opacity:0.2;transform:scale(1)}50%{opacity:1;transform:scale(1.4)}}

/* Grid lines */
.lb-grid{position:absolute;inset:0;z-index:1;
  background-image:
    linear-gradient(rgba(26,111,255,0.04) 1px,transparent 1px),
    linear-gradient(90deg,rgba(26,111,255,0.04) 1px,transparent 1px);
  background-size:60px 60px}

/* Glowing orbs */
.lb-orb{position:absolute;border-radius:50%;filter:blur(80px);z-index:1;animation:orb-float 8s ease-in-out infinite}
.lb-orb1{width:400px;height:400px;background:rgba(26,111,255,0.12);top:-100px;left:-100px;animation-delay:-3s}
.lb-orb2{width:300px;height:300px;background:rgba(0,200,255,0.08);bottom:-80px;right:-80px}
.lb-orb3{width:200px;height:200px;background:rgba(26,111,255,0.1);top:40%;left:60%;animation-delay:-5s}
@keyframes orb-float{0%,100%{transform:translate(0,0)}50%{transform:translate(20px,-20px)}}

.lb-content{position:relative;z-index:2;display:flex;flex-direction:column;height:100%;padding:0 20px 24px}

/* Lobby header */
.lb-header{padding:52px 0 28px;text-align:center}
.lb-logo{font-family:'Cinzel',serif;font-size:2.8rem;font-weight:700;
  background:linear-gradient(135deg,var(--lb-arc2),var(--lb-arc),#6a8fff);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  letter-spacing:0.35em;line-height:1}
.lb-tagline{font-family:'Share Tech Mono',monospace;font-size:0.52rem;color:var(--lb-arc);
  letter-spacing:0.28em;margin-top:6px;opacity:0.7}
.lb-pulse{display:inline-block;width:6px;height:6px;border-radius:50%;
  background:var(--lb-arc2);margin-right:8px;
  animation:pulse 2s ease-in-out infinite;vertical-align:middle}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(0,200,255,0.5)}50%{box-shadow:0 0 0 8px rgba(0,200,255,0)}}

/* New mission button */
.lb-new{display:flex;align-items:center;justify-content:center;gap:10px;
  margin:0 0 24px;padding:16px;
  background:linear-gradient(135deg,rgba(26,111,255,0.15),rgba(0,200,255,0.08));
  border:1px solid rgba(26,111,255,0.35);border-radius:var(--radius);
  cursor:pointer;transition:var(--trans);color:var(--lb-arc2);
  font-family:'Share Tech Mono',monospace;font-size:0.72rem;letter-spacing:0.2em;
  position:relative;overflow:hidden}
.lb-new::before{content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(26,111,255,0.1),transparent);
  opacity:0;transition:opacity 0.3s}
.lb-new:active::before{opacity:1}
.lb-new:active{transform:scale(0.98)}
.lb-new-icon{font-size:1.2rem}

/* Missions list */
.lb-missions-label{font-family:'Share Tech Mono',monospace;font-size:0.48rem;
  color:var(--lb-dim);letter-spacing:0.22em;margin-bottom:10px;padding:0 4px}
.lb-missions{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;
  scrollbar-width:none}
.lb-missions::-webkit-scrollbar{display:none}

.mission-card{background:rgba(255,255,255,0.02);border:1px solid rgba(26,111,255,0.12);
  border-radius:var(--radius);padding:14px 16px;cursor:pointer;
  transition:var(--trans);position:relative;overflow:hidden}
.mission-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
  background:linear-gradient(180deg,var(--lb-arc),var(--lb-arc2));
  border-radius:3px 0 0 3px;opacity:0;transition:opacity 0.3s}
.mission-card:active{background:rgba(26,111,255,0.06)}
.mission-card:active::before{opacity:1}
.mc-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mc-name{font-family:'Cinzel',serif;font-size:0.82rem;color:var(--lb-txt2);
  letter-spacing:0.08em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc-actions{display:flex;gap:6px;flex-shrink:0}
.mc-btn{width:26px;height:26px;border:1px solid rgba(26,111,255,0.15);border-radius:6px;
  background:transparent;color:var(--lb-dim);cursor:pointer;font-size:0.65rem;
  display:flex;align-items:center;justify-content:center;transition:var(--trans)}
.mc-btn:active{border-color:var(--lb-arc);color:var(--lb-arc)}
.mc-btn.del:active{border-color:#ff4466;color:#ff4466}
.mc-meta{display:flex;gap:12px;margin-top:6px}
.mc-stat{font-family:'Share Tech Mono',monospace;font-size:0.45rem;color:var(--lb-dim);
  letter-spacing:0.1em}
.mc-stat span{color:var(--lb-arc);margin-right:3px}
.mc-date{font-family:'Share Tech Mono',monospace;font-size:0.42rem;color:var(--lb-dim);
  margin-top:4px;letter-spacing:0.06em}

.lb-empty{flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:12px;opacity:0.4}
.lb-empty-icon{font-size:2.5rem}
.lb-empty-txt{font-family:'Share Tech Mono',monospace;font-size:0.52rem;
  letter-spacing:0.14em;text-align:center;line-height:2}

/* ═══════════════════════════════════════
   TRANSITION OVERLAY
═══════════════════════════════════════ */
#transition-overlay{position:fixed;inset:0;z-index:900;
  background:var(--ms-bg);
  opacity:0;pointer-events:none;transition:opacity 0.6s ease;
  display:flex;align-items:center;justify-content:center}
#transition-overlay.active{opacity:1;pointer-events:all}
.tov-ring{width:120px;height:120px;border-radius:50%;
  border:2px solid rgba(201,151,58,0.5);
  box-shadow:0 0 40px rgba(201,151,58,0.3),inset 0 0 40px rgba(201,151,58,0.1);
  animation:tov-spin 1.5s linear infinite;display:none}
#transition-overlay.active .tov-ring{display:block}
@keyframes tov-spin{to{transform:rotate(360deg)}}

/* ═══════════════════════════════════════
   MISSION SCREEN
═══════════════════════════════════════ */
#mission{background:#f5f0e8;overflow:hidden}

/* 3D Globe canvas */
@keyframes globe-spin{from{transform:rotateY(0deg)}to{transform:rotateY(360deg)}}


.ms-content{position:relative;z-index:2;display:flex;flex-direction:column;flex:1;min-height:0}

/* Mission header */
.ms-header{display:flex;align-items:center;padding:52px 20px 16px;gap:12px;flex-shrink:0}
.ms-back{width:36px;height:36px;border:1px solid rgba(201,151,58,0.3);border-radius:10px;
  background:rgba(201,151,58,0.06);color:var(--ms-gold);cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:0.9rem;
  transition:var(--trans);flex-shrink:0}
.ms-back:active{background:rgba(201,151,58,0.15)}
.ms-name-wrap{flex:1;min-width:0}
.ms-name{font-family:'Cinzel',serif;font-size:1.1rem;font-weight:600;
  color:var(--ms-txt);letter-spacing:0.1em;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.ms-name:hover{color:var(--ms-gold)}
.ms-name-input{font-family:'Cinzel',serif;font-size:1.1rem;font-weight:600;
  color:var(--ms-txt);letter-spacing:0.1em;background:transparent;
  border:none;border-bottom:1px solid var(--ms-gold);outline:none;width:100%;
  padding:2px 0}
.ms-subtitle{font-family:'Share Tech Mono',monospace;font-size:0.44rem;
  color:var(--ms-dim);letter-spacing:0.16em;margin-top:2px}

/* Tabs */
.ms-tabs{display:flex;padding:0 20px 0;gap:6px;flex-shrink:0;margin-bottom:16px}
.ms-tab{flex:1;padding:10px 4px;border:1px solid rgba(201,151,58,0.2);
  border-radius:10px;background:transparent;color:var(--ms-dim);
  font-family:'Cinzel',serif;font-size:0.58rem;letter-spacing:0.14em;
  cursor:pointer;transition:var(--trans);text-align:center}
.ms-tab.active{background:rgba(201,151,58,0.12);border-color:rgba(201,151,58,0.5);
  color:var(--ms-gold)}
.ms-tab:active{transform:scale(0.97)}

/* Tab panels */
.ms-panels{flex:1;overflow:hidden;position:relative;background:#f5f0e8;min-height:0}
.ms-panel{position:absolute;inset:0;overflow-y:auto;padding:0 20px 24px;
  opacity:0;pointer-events:none;transition:opacity 0.3s;scrollbar-width:none;background:#f5f0e8}
.ms-panel::-webkit-scrollbar{display:none}
.ms-panel.active{opacity:1;pointer-events:all}

/* ═══════════════════════════════════════
   BRAINSTORM PANEL
═══════════════════════════════════════ */
.bs-chat{display:flex;flex-direction:column;gap:14px;padding-bottom:90px}
.bs-msg{display:flex;flex-direction:column;gap:4px}
.bs-msg.user{align-items:flex-end}
.bs-msg.ai{align-items:flex-start}
.bs-bubble{max-width:85%;padding:12px 16px;border-radius:16px;
  font-size:0.88rem;line-height:1.7;font-weight:300}
.bs-msg.user .bs-bubble{background:var(--ms-gold);color:#fff;
  border-radius:16px 16px 4px 16px}
.bs-msg.ai .bs-bubble{background:rgba(201,151,58,0.08);
  border:1px solid rgba(201,151,58,0.2);color:var(--ms-txt);
  border-radius:4px 16px 16px 16px}
.bs-label{font-family:'Share Tech Mono',monospace;font-size:0.42rem;
  color:var(--ms-dim);letter-spacing:0.12em}
.bs-thinking{display:flex;gap:5px;padding:14px 16px;
  background:rgba(201,151,58,0.06);border:1px solid rgba(201,151,58,0.15);
  border-radius:4px 16px 16px 16px;width:fit-content}
.bs-dot{width:7px;height:7px;border-radius:50%;background:var(--ms-gold);
  animation:bs-bounce 1.2s ease-in-out infinite}
.bs-dot:nth-child(2){animation-delay:0.2s}
.bs-dot:nth-child(3){animation-delay:0.4s}
@keyframes bs-bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-8px)}}

.bs-input-wrap{position:fixed;bottom:0;left:0;right:0;z-index:50;
  padding:12px 20px 28px;
  background:linear-gradient(to top,var(--ms-bg) 70%,transparent)}
.bs-input-row{display:flex;gap:10px;align-items:flex-end}
.bs-input{flex:1;padding:12px 16px;border-radius:12px;
  border:1px solid rgba(201,151,58,0.3);background:var(--ms-paper);
  color:var(--ms-txt);font-family:'Spectral',serif;font-size:0.9rem;
  resize:none;outline:none;min-height:46px;max-height:120px;
  transition:border-color 0.2s;line-height:1.5}
.bs-input:focus{border-color:var(--ms-gold)}
.bs-input::placeholder{color:var(--ms-dim);font-style:italic}
.bs-send{width:46px;height:46px;border-radius:12px;flex-shrink:0;
  background:var(--ms-gold);border:none;color:#fff;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-size:1rem;transition:var(--trans)}
.bs-send:active{transform:scale(0.93);background:var(--ms-gold2)}
.bs-send:disabled{opacity:0.4}

/* ═══════════════════════════════════════
   IMAGES PANEL
═══════════════════════════════════════ */
.gen-form{background:rgba(201,151,58,0.06);border:1px solid rgba(201,151,58,0.2);
  border-radius:var(--radius);padding:16px;margin-bottom:16px}
.gen-label{font-family:'Cinzel',serif;font-size:0.6rem;color:var(--ms-gold);
  letter-spacing:0.18em;margin-bottom:8px}
.gen-input{width:100%;padding:12px;border-radius:10px;
  border:1px solid rgba(201,151,58,0.25);background:var(--ms-paper);
  color:var(--ms-txt);font-family:'Spectral',serif;font-size:0.88rem;
  resize:none;outline:none;min-height:72px;line-height:1.6;
  transition:border-color 0.2s}
.gen-input:focus{border-color:var(--ms-gold)}
.gen-input::placeholder{color:var(--ms-dim);font-style:italic}
.gen-btn{width:100%;margin-top:10px;padding:13px;border-radius:10px;
  background:linear-gradient(135deg,var(--ms-gold),var(--ms-gold2));
  border:none;color:#fff;font-family:'Cinzel',serif;font-size:0.68rem;
  letter-spacing:0.2em;cursor:pointer;transition:var(--trans)}
.gen-btn:active{transform:scale(0.98);opacity:0.9}
.gen-btn:disabled{opacity:0.5;cursor:not-allowed}

/* Generated items */
.gen-items{display:flex;flex-direction:column;gap:16px;padding-bottom:24px}
.gen-item{background:var(--ms-paper);border:1px solid rgba(201,151,58,0.2);
  border-radius:var(--radius);overflow:hidden}
.gen-item-img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.gen-item-vid{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#000}
.gen-item-actions{display:flex;gap:8px;padding:12px;flex-wrap:wrap}
.gen-action{flex:1;min-width:0;padding:8px 4px;border-radius:8px;
  border:1px solid rgba(201,151,58,0.25);background:transparent;
  color:var(--ms-gold);font-family:'Share Tech Mono',monospace;font-size:0.5rem;
  letter-spacing:0.1em;cursor:pointer;transition:var(--trans);text-align:center;
  white-space:nowrap}
.gen-action:active{background:rgba(201,151,58,0.1)}
.gen-prompt-shown{font-family:'Share Tech Mono',monospace;font-size:0.48rem;
  color:var(--ms-dim);padding:0 12px 12px;line-height:1.7;
  border-top:1px solid rgba(201,151,58,0.1);padding-top:10px}

/* Edit form */
.edit-form{padding:12px;border-top:1px solid rgba(201,151,58,0.15);
  display:none;flex-direction:column;gap:8px}
.edit-form.open{display:flex}
.edit-input{width:100%;padding:10px;border-radius:8px;
  border:1px solid rgba(201,151,58,0.25);background:var(--ms-paper);
  color:var(--ms-txt);font-family:'Spectral',serif;font-size:0.85rem;
  resize:none;outline:none;min-height:56px;line-height:1.5}
.edit-input:focus{border-color:var(--ms-gold)}
.edit-submit{padding:9px;border-radius:8px;
  background:var(--ms-gold);border:none;color:#fff;
  font-family:'Cinzel',serif;font-size:0.58rem;letter-spacing:0.16em;
  cursor:pointer;transition:var(--trans)}
.edit-submit:active{opacity:0.85}

/* Prompt bubble in image/video panels */
.gen-group{display:flex;flex-direction:column;gap:10px;margin-bottom:16px;}
.prompt-bubble .bs-bubble{background:rgba(201,151,58,0.08);border:1px solid rgba(201,151,58,0.2);color:var(--ms-txt);font-size:0.82rem;line-height:1.7;border-radius:4px 16px 16px 16px;}
.prompt-bubble .bs-label{color:var(--ms-dim);}

/* Loading state */
.gen-loading{display:flex;flex-direction:column;align-items:center;
  gap:16px;padding:40px 20px;
  background:var(--ms-paper);border:1px solid rgba(201,151,58,0.2);
  border-radius:var(--radius)}
.gen-loading-ring{width:56px;height:56px;border-radius:50%;
  border:2px solid rgba(201,151,58,0.15);
  border-top-color:var(--ms-gold);
  animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.gen-loading-txt{font-family:'Share Tech Mono',monospace;font-size:0.52rem;
  color:var(--ms-dim);letter-spacing:0.16em;animation:flicker 2s ease-in-out infinite}
@keyframes flicker{0%,100%{opacity:1}50%{opacity:0.5}}

/* ═══════════════════════════════════════
   MODALS
═══════════════════════════════════════ */
.modal-overlay{position:fixed;inset:0;z-index:800;background:rgba(0,0,0,0.5);
  display:flex;align-items:flex-end;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity 0.3s;backdrop-filter:blur(4px)}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal{background:var(--lb-bg2);border:1px solid rgba(26,111,255,0.2);
  border-radius:20px 20px 0 0;padding:28px 24px 40px;width:100%;
  transform:translateY(100%);transition:transform 0.4s cubic-bezier(0.4,0,0.2,1)}
.modal-overlay.open .modal{transform:translateY(0)}
.modal-title{font-family:'Cinzel',serif;font-size:0.9rem;color:var(--lb-txt2);
  letter-spacing:0.14em;margin-bottom:20px}
.modal-input{width:100%;padding:14px;border-radius:10px;
  border:1px solid rgba(26,111,255,0.25);background:rgba(26,111,255,0.06);
  color:var(--lb-txt2);font-family:'Cinzel',serif;font-size:0.9rem;
  letter-spacing:0.1em;outline:none}
.modal-input:focus{border-color:var(--lb-arc)}
.modal-input::placeholder{color:var(--lb-dim);font-family:'Spectral',serif;
  font-style:italic;letter-spacing:0.04em}
.modal-actions{display:flex;gap:10px;margin-top:16px}
.modal-btn{flex:1;padding:13px;border-radius:10px;cursor:pointer;
  font-family:'Cinzel',serif;font-size:0.65rem;letter-spacing:0.14em;
  transition:var(--trans);border:none}
.modal-btn.primary{background:linear-gradient(135deg,var(--lb-arc),var(--lb-arc2));color:#fff}
.modal-btn.secondary{background:rgba(255,255,255,0.05);color:var(--lb-txt);
  border:1px solid rgba(26,111,255,0.15)}
.modal-btn:active{transform:scale(0.97)}

/* Toast */
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(20px);
  background:rgba(10,15,30,0.95);border:1px solid rgba(26,111,255,0.3);
  color:var(--lb-txt2);padding:10px 20px;border-radius:20px;
  font-family:'Share Tech Mono',monospace;font-size:0.55rem;letter-spacing:0.12em;
  z-index:999;opacity:0;transition:all 0.3s;white-space:nowrap;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.ms-toast{background:rgba(250,247,242,0.95);border-color:rgba(201,151,58,0.4);
  color:var(--ms-txt)}
</style>
</head>
<body>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Transition overlay -->
<div id="transition-overlay">
  <div class="tov-ring"></div>
</div>

<!-- New Mission Modal -->
<div class="modal-overlay" id="new-mission-modal">
  <div class="modal">
    <div class="modal-title">⬡ NAME YOUR MISSION</div>
    <input class="modal-input" id="mission-name-input" placeholder="Give it a name..." maxlength="40">
    <div class="modal-actions">
      <button class="modal-btn secondary" onclick="closeModal('new-mission-modal')">CANCEL</button>
      <button class="modal-btn primary" onclick="createMission()">LAUNCH</button>
    </div>
  </div>
</div>

<!-- Delete Confirm Modal -->
<div class="modal-overlay" id="delete-modal">
  <div class="modal">
    <div class="modal-title">✕ DELETE MISSION?</div>
    <p style="font-family:'Spectral',serif;font-size:0.85rem;color:var(--lb-txt);line-height:1.7;margin-bottom:4px">This cannot be undone. All images, videos, and brainstorm messages will be lost.</p>
    <div class="modal-actions">
      <button class="modal-btn secondary" onclick="closeModal('delete-modal')">CANCEL</button>
      <button class="modal-btn primary" style="background:linear-gradient(135deg,#c0392b,#e74c3c)" onclick="doDelete()">DELETE</button>
    </div>
  </div>
</div>

<!-- Rename Modal -->
<div class="modal-overlay" id="rename-modal">
  <div class="modal">
    <div class="modal-title">✦ RENAME MISSION</div>
    <input class="modal-input" id="rename-input" placeholder="New name..." maxlength="40">
    <div class="modal-actions">

<div class="screen hidden" id="mission">
  <div class="ms-content">

    </div>
    <div class="ms-panels">

      <!-- BRAINSTORM PANEL -->
      <div class="ms-panel active" id="panel-brainstorm">
        <div class="bs-chat" id="bs-chat"></div>
        <div style="height:90px"></div>
      </div>

      <!-- IMAGES PANEL -->
      <div class="ms-panel" id="panel-images">
        <div class="gen-form">

        oninput="autoResize(this)" onkeydown="bsKeydown(event)"></textarea>

<script src="https://js.puter.com/v2/"></script>
<script>
// ═══════════════════════════════════════
// STATE
// ═══════════════════════════════════════
let currentMissionId = null;
let renamingMissionId = null;
let activeTab = 'brainstorm';
let bsBusy = false;
let imgBusy = false;
let deleteTarget = null;

// ═══════════════════════════════════════
// STORAGE
// ═══════════════════════════════════════
function getMissions(){ try{ return JSON.parse(localStorage.getItem('inator_missions')||'[]'); }catch(e){ return []; } }
function saveMissions(m){ localStorage.setItem('inator_missions',JSON.stringify(m)); }
function getMission(id){ return getMissions().find(m=>m.id===id); }
function updateMission(id,fn){
  const ms=getMissions(); const idx=ms.findIndex(m=>m.id===id);
  if(idx>=0){ fn(ms[idx]); saveMissions(ms); }
}
function genId(){ return 'ms_'+Date.now()+'_'+Math.random().toString(36).slice(2,6); }

// ═══════════════════════════════════════
// PUTER AI — single wrapper, correct call signature
// ═══════════════════════════════════════
// Puter v2: system_prompt is often ignored on free tier — inject into message directly
async function puterChat(userMsg, systemPrompt, model='claude-sonnet-4-5'){
  const opts = { model };
  // Inject system prompt as hard prefix so it cannot be ignored
  const fullMsg = systemPrompt
    ? `[INSTRUCTIONS — follow these exactly, they override everything else]\n${systemPrompt}\n\n[USER INPUT]\n${userMsg}`
    : userMsg;
  const res = await puter.ai.chat(fullMsg, opts);
  if(typeof res === 'string') return res.trim();
  // Handle all known response shapes
  return (
    res?.message?.content?.[0]?.text ||
    res?.content?.[0]?.text ||
    res?.text ||
    String(res)
  ).trim();
}

// ═══════════════════════════════════════
// STARFIELD
// ═══════════════════════════════════════
function buildStars(){
  const sf=document.getElementById('starfield');
  for(let i=0;i<80;i++){
    const s=document.createElement('div'); s.className='star';
    const sz=Math.random()*2.5+0.5;
    s.style.cssText=`width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*100}%;background:rgba(${100+Math.random()*155},${150+Math.random()*100},255,${0.4+Math.random()*0.6});--d:${2+Math.random()*4}s;--delay:-${Math.random()*4}s`;
    sf.appendChild(s);
  }
}


// ═══════════════════════════════════════
// MISSIONS LIST
// ═══════════════════════════════════════
function renderMissions(){
  const list=document.getElementById('missions-list');
  const missions=getMissions();
  if(missions.length===0){
    list.innerHTML=`<div class="lb-empty"><div class="lb-empty-icon">✦</div><div class="lb-empty-txt">NO MISSIONS YET<br>CREATE YOUR FIRST</div></div>`;
    return;
  }
  list.innerHTML=missions.map(m=>`
    <div class="mission-card" onclick="openMission('${m.id}')">
      <div class="mc-top">
        <div class="mc-name">${escH(m.name)}</div>
        <div class="mc-actions">
          <button class="mc-btn" onclick="event.stopPropagation();startRenameFromLobby('${m.id}')" title="Rename">✎</button>
          <button class="mc-btn del" onclick="event.stopPropagation();confirmDelete('${m.id}')" title="Delete">✕</button>
        </div>
      </div>
      <div class="mc-meta">
        <div class="mc-stat"><span>${m.images?.length||0}</span>IMAGES</div>
                <div class="mc-stat"><span>${m.brainstorm?.length||0}</span>MESSAGES</div>
      </div>
      <div class="mc-date">${new Date(m.updatedAt||m.createdAt).toLocaleDateString('en-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}</div>
    </div>`).join('');
}

// ═══════════════════════════════════════
// MISSION CRUD
// ═══════════════════════════════════════
function openNewMissionModal(){
  document.getElementById('mission-name-input').value='';
  openModal('new-mission-modal');
  setTimeout(()=>document.getElementById('mission-name-input').focus(),400);
}

function createMission(){
  const name=document.getElementById('mission-name-input').value.trim();
  if(!name){ toast('Name your mission first'); return; }
  const id=genId();
  const missions=getMissions();
  missions.unshift({id,name,createdAt:Date.now(),updatedAt:Date.now(),brainstorm:[],images:[]});
  saveMissions(missions);
  closeModal('new-mission-modal');
  renderMissions();
  setTimeout(()=>openMission(id),200);
}

function confirmDelete(id){
  deleteTarget=id;
  openModal('delete-modal');
}

function doDelete(){
  if(!deleteTarget) return;
  saveMissions(getMissions().filter(m=>m.id!==deleteTarget));
  deleteTarget=null;
  closeModal('delete-modal');
  renderMissions();
  toast('Mission deleted');
}

function startRenameFromLobby(id){
  renamingMissionId=id;
  const m=getMission(id);
  document.getElementById('rename-input').value=m.name;
  openModal('rename-modal');
  setTimeout(()=>document.getElementById('rename-input').focus(),400);
}

function startRename(){
  renamingMissionId=currentMissionId;
  const m=getMission(currentMissionId);
  document.getElementById('rename-input').value=m.name;
  openModal('rename-modal');
  setTimeout(()=>document.getElementById('rename-input').focus(),400);
}

function confirmRename(){
  const name=document.getElementById('rename-input').value.trim();
  if(!name){ toast('Enter a name'); return; }
  updateMission(renamingMissionId,m=>{ m.name=name; m.updatedAt=Date.now(); });
  if(renamingMissionId===currentMissionId){
    document.getElementById('ms-name-display').textContent=name;
  }
  renderMissions();
  closeModal('rename-modal');
  toast('Mission renamed');
}

// ═══════════════════════════════════════
// OPEN / EXIT MISSION
// ═══════════════════════════════════════
function openMission(id){
  currentMissionId=id;
  const m=getMission(id);
  document.getElementById('ms-name-display').textContent=m.name;

  // Reset to brainstorm tab
  document.querySelectorAll('.ms-tab').forEach((t,i)=>t.classList.toggle('active',i===0));
  document.querySelectorAll('.ms-panel').forEach((p,i)=>p.classList.toggle('active',i===0));
  activeTab='brainstorm';
  document.getElementById('bs-input-wrap').style.display='block';

  loadBrainstorm(m);
  loadImages(m);

  const overlay=document.getElementById('transition-overlay');
  overlay.classList.add('active');
  setTimeout(()=>{
    // Hide lobby
    const lb=document.getElementById('lobby');
    lb.style.display='none';
    // Show mission — force style directly, bypass all class conflicts
    const ms=document.getElementById('mission');
    ms.classList.remove('hidden');
    ms.style.cssText='display:flex !important;flex-direction:column;position:fixed;inset:0;background:#f5f0e8;z-index:10;';
    setTimeout(()=>{
      overlay.classList.remove('active');
    },600);
  },400);
}

function exitMission(){
  updateMission(currentMissionId,m=>{ m.updatedAt=Date.now(); });
  const overlay=document.getElementById('transition-overlay');
  overlay.classList.add('active');
  setTimeout(()=>{
    // Hide mission
    const ms=document.getElementById('mission');
    ms.style.cssText='display:none !important;';
    ms.classList.add('hidden');
    // Show lobby
    const lb=document.getElementById('lobby');
    lb.style.display='';
    lb.classList.remove('hidden');
    renderMissions();
    currentMissionId=null;
    setTimeout(()=>overlay.classList.remove('active'),600);
  },400);
}

// ═══════════════════════════════════════
// TABS
// ═══════════════════════════════════════
function switchTab(tab,btn){
  activeTab=tab;
  document.querySelectorAll('.ms-tab').forEach(t=>t.classList.remove('active'));
  if(btn) btn.classList.add('active');
  document.querySelectorAll('.ms-panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('panel-'+tab).classList.add('active');
  document.getElementById('bs-input-wrap').style.display=tab==='brainstorm'?'block':'none';
}

// ═══════════════════════════════════════
// BRAINSTORM
// ═══════════════════════════════════════
const BS_SYSTEM=`You are a visionary creative director inside INATOR, an AI creation studio.
Your role is to help the user brainstorm and develop ideas for images and videos.
Be imaginative, evocative, and inspiring. Ask clarifying questions when helpful.
Suggest styles, moods, compositions, color palettes, and narratives.
Keep responses concise but rich. Use vivid language. Never use bullet lists — write in flowing, inspiring prose.`;

function loadBrainstorm(m){
  const chat=document.getElementById('bs-chat');
  chat.innerHTML='';
  if(m.brainstorm.length===0){
    addBsMsg('ai','Welcome. I\'m your creative director for this mission. Tell me what you want to create — an image, a video, a feeling, a scene. Let\'s build something extraordinary.',false);
  } else {
    m.brainstorm.forEach(msg=>addBsMsg(msg.role,msg.content,false));
  }
  scrollBsBottom();
}

function addBsMsg(role,content,save=true){
  const chat=document.getElementById('bs-chat');
  const div=document.createElement('div');
  div.className=`bs-msg ${role==='user'?'user':'ai'}`;
  div.innerHTML=`<div class="bs-label">${role==='user'?'YOU':'INATOR'}</div><div class="bs-bubble">${escH(content).replace(/\n/g,'<br>')}</div>`;
  chat.appendChild(div);
  if(save && currentMissionId){
    updateMission(currentMissionId,m=>{ m.brainstorm.push({role,content}); m.updatedAt=Date.now(); });
  }
  scrollBsBottom();
}

function showBsThinking(){
  const chat=document.getElementById('bs-chat');
  const div=document.createElement('div');
  div.className='bs-msg ai'; div.id='bs-thinking';
  div.innerHTML=`<div class="bs-label">INATOR</div><div class="bs-thinking"><div class="bs-dot"></div><div class="bs-dot"></div><div class="bs-dot"></div></div>`;
  chat.appendChild(div); scrollBsBottom();
}

function removeBsThinking(){ document.getElementById('bs-thinking')?.remove(); }

function scrollBsBottom(){
  const panel=document.getElementById('panel-brainstorm');
  setTimeout(()=>panel.scrollTo({top:panel.scrollHeight,behavior:'smooth'}),50);
}

async function sendBrainstorm(){
  if(bsBusy) return;
  const inp=document.getElementById('bs-input');
  const txt=inp.value.trim();
  if(!txt) return;
  inp.value=''; autoResize(inp);
  addBsMsg('user',txt);
  bsBusy=true;
  document.getElementById('bs-send').disabled=true;
  showBsThinking();

  // Build conversation context as a single string
  // Puter v2 only accepts a string as first arg — history injected into system prompt
  const m=getMission(currentMissionId);
  const history=m.brainstorm.slice(-12); // last 12 turns for context
  let contextBlock='';
  if(history.length>0){
    contextBlock='\n\nCONVERSATION SO FAR:\n'+history.map(h=>(h.role==='user'?'User: ':'You: ')+h.content).join('\n');
  }
  const fullSystem=BS_SYSTEM+contextBlock+'\n\nNow respond to the user\'s latest message only. Do not repeat previous responses.';

  try{
    const reply=await puterChat(txt, fullSystem);
    removeBsThinking();
    addBsMsg('ai',reply);
  } catch(e){
    console.error('Brainstorm error:',e);
    removeBsThinking();
    addBsMsg('ai','Something went wrong on my end. Please try again in a moment.');
  } finally {
    bsBusy=false;
    document.getElementById('bs-send').disabled=false;
  }
}

function bsKeydown(e){
  if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); sendBrainstorm(); }
}

function autoResize(el){
  el.style.height='auto';
  el.style.height=Math.min(el.scrollHeight,120)+'px';
}

// ═══════════════════════════════════════
// IMAGE GENERATION
// ═══════════════════════════════════════
const IMG_SYSTEM=`You are a Pollinations AI prompt engineer. Your ONLY job is to convert whatever the user gives you into a rich, detailed image generation prompt for Pollinations AI.

## YOUR SINGLE RULE:
**No matter how the user phrases their request — whether they simply write a word like "cat", or say "generate an image of a cat", or "create a picture of a cat" — your response must ALWAYS and ONLY be a Pollinations AI image prompt. Nothing else.**

## WHAT YOU OUTPUT:
A single, detailed Pollinations AI prompt. No explanations. No preamble. No "Here is your prompt:". Just the raw prompt text itself, ready to be dropped directly into Pollinations AI.

## HOW TO WRITE THE PROMPT:
- Expand the user's input into a vivid, descriptive scene
- Include: subject details, art style, lighting, mood, color palette, camera angle, and quality boosters
- Always end with quality tags such as: \`highly detailed, 4K, sharp focus, professional photography\` (or relevant equivalents)
- Match the style to the subject (e.g. photorealistic for objects/scenes, painterly for fantasy, etc.)

## EXAMPLES:

User input: \`apple\`
Your output:
\`A single red apple resting on a rustic wooden table, soft natural window light casting a gentle shadow, photorealistic, macro lens, vibrant red and green tones, highly detailed, 4K, sharp focus\`

User input: \`generate an image of a cyberpunk city\`
Your output:
\`A sprawling cyberpunk metropolis at night, towering neon-lit skyscrapers reflecting off rain-soaked streets, flying vehicles in the smoggy sky, holographic advertisements glowing in purple and cyan, cinematic wide shot, dramatic lighting, ultra-detailed, 4K, hyperrealistic\`

User input: \`create a picture of a lonely astronaut\`
Your output:
\`A lone astronaut standing on the surface of a desolate alien planet, gazing up at a massive ringed gas giant filling the sky, distant stars, dramatic rim lighting from a nearby sun, dust swirling at their feet, photorealistic, cinematic composition, epic scale, highly detailed, 4K\`

## ⚠️ CRITICAL REMINDERS:
- **"dog"** → write a Pollinations prompt about a dog. That's it.
- **"generate an image of a dog"** → write a Pollinations prompt about a dog. That's it.
- **NEVER explain what you're doing.**
- **NEVER ask clarifying questions.**
- **NEVER output anything except the prompt.**`;

function loadImages(m){
  const container=document.getElementById('img-items');
  container.innerHTML='';
  m.images.forEach((img,i)=>renderImageItem(img,i));
}

function renderImageItem(img,idx){
  const container=document.getElementById('img-items');
  const div=document.createElement('div'); div.className='gen-item'; div.id=`img-item-${idx}`;
  // Store actual array index as data attribute to avoid DOM order mismatch
  div.dataset.imgIdx=idx;
  div.innerHTML=`
    <img class="gen-item-img" src="${img.url}" alt="Generated image" loading="lazy" onerror="this.style.opacity=0.3;this.alt='Image expired — regenerate'">
    <div class="gen-prompt-shown">${escH(img.prompt.slice(0,120))}${img.prompt.length>120?'...':''}</div>
    <div class="gen-item-actions">
      <button class="gen-action" onclick="downloadMedia('${escH(img.url)}','inator-image-${idx}.jpg')">↓ SAVE</button>
      <button class="gen-action" onclick="shareMedia('${escH(img.url)}','Generated by INATOR')">↗ SHARE</button>
      <button class="gen-action" onclick="toggleEdit(${idx},'img')">✎ EDIT</button>
    </div>
    <div class="edit-form" id="edit-img-${idx}">
      <textarea class="edit-input" id="edit-input-img-${idx}" placeholder="Describe your edit... e.g. make it sunset, add fog, change to winter"></textarea>
      <button class="edit-submit" onclick="editImage(${idx})">APPLY EDIT</button>
    </div>`;
  container.prepend(div);
}

async function generateImage(){
  if(imgBusy) return;
  const input=document.getElementById('img-input');
  const brief=input.value.trim();
  if(!brief){ toast('Describe what you want'); return; }

  imgBusy=true;
  const btn=document.getElementById('img-btn');
  btn.disabled=true; btn.textContent='CRAFTING PROMPT...';
  // Create a permanent group wrapper — prompt bubble + image live here together
  const group=document.createElement('div');
  group.className='gen-group';
  document.getElementById('img-items').prepend(group);

  // Loading spinner inside the group
  const loading=document.createElement('div');
  loading.className='gen-loading';
  loading.innerHTML=`<div class="gen-loading-ring"></div><div class="gen-loading-txt">Crafting your prompt...</div>`;
  group.appendChild(loading);

  try{
    // Step 1: Claude writes the prompt
    const imgMsg=`You are a Pollinations AI image prompt engineer. Your only output must be a single image generation prompt — no explanations, no apologies, no refusals, no descriptions, nothing else. Just the raw prompt text ready for Pollinations AI. Expand the following into a vivid, detailed image prompt with subject, art style, lighting, mood, color palette, camera angle, ending with: highly detailed, 4K, sharp focus.\n\nUser wants: ${brief}`;
    const genPrompt=await puterChat(imgMsg);

    // Prompt bubble — permanent, stays above the image
    const bubble=document.createElement('div');
    bubble.className='bs-msg ai prompt-bubble';
    bubble.innerHTML=`<div class="bs-label">INATOR — CRAFTED PROMPT</div><div class="bs-bubble">${escH(genPrompt).replace(/\n/g,'<br>')}</div>`;
    group.insertBefore(bubble, loading);

    btn.textContent='GENERATING IMAGE...';
    loading.querySelector('.gen-loading-txt').textContent='PAINTING YOUR IMAGE...';

    // Step 2: Pollinations
    const encoded=encodeURIComponent(genPrompt.trim());
    const seed=Math.floor(Math.random()*99999);
    const imgUrl=`https://image.pollinations.ai/prompt/${encoded}?width=1024&height=1024&seed=${seed}&model=flux&nologo=true&enhance=true`;

    await preloadImgWithTimeout(imgUrl, 120000);
    loading.remove();

    // Image card renders inside the same group, below the bubble
    const imgData={url:imgUrl,prompt:genPrompt,brief,createdAt:Date.now()};
    updateMission(currentMissionId,m=>{ m.images.push(imgData); m.updatedAt=Date.now(); });
    const m=getMission(currentMissionId);
    renderImageItemInGroup(imgData, m.images.length-1, group);
    input.value='';
    toast('Image created');
  } catch(e){
    console.error('Image error:',e);
    loading.remove();
    toast('Generation failed — Pollinations may be busy. Try again.');
  } finally {
    imgBusy=false;
    btn.disabled=false; btn.textContent='GENERATE IMAGE';
  }
}

async function editImage(idx){
  const editInput=document.getElementById(`edit-input-img-${idx}`);
  const editTxt=editInput.value.trim();
  if(!editTxt){ toast('Describe your edit'); return; }

  const m=getMission(currentMissionId);
  // Use the actual array index from the item element to avoid DOM order mismatch
  const itemEl=document.getElementById(`img-item-${idx}`);
  const actualIdx=itemEl ? parseInt(itemEl.dataset.imgIdx||idx) : idx;
  const original=m.images[actualIdx]||m.images[idx];

  editInput.disabled=true;
  const submitBtn=editInput.nextElementSibling;
  submitBtn.disabled=true; submitBtn.textContent='EDITING...';
  // Show loading inline inside the edit form, not at top of list
  const editFormEl=document.getElementById(`edit-img-${idx}`);
  const loading=document.createElement('div'); loading.className='gen-loading'; loading.style.marginTop='8px';
  loading.innerHTML=`<div class="gen-loading-ring"></div><div class="gen-loading-txt">APPLYING EDIT...</div>`;
  editFormEl.appendChild(loading);

  try{
    const editMsg=`You are a Pollinations AI image prompt engineer. The user wants to modify an existing AI-generated image. Output ONLY the new complete image generation prompt — no explanations, no preamble, nothing else. Just the raw prompt text. Original prompt: "${original.prompt}". Modification requested: "${editTxt}". Write the full updated prompt incorporating the change, ending with: highly detailed, 4K, sharp focus.`;
    const newPrompt=await puterChat(editMsg);
    const encoded=encodeURIComponent(newPrompt.trim());
    const seed=Math.floor(Math.random()*99999);
    const imgUrl=`https://image.pollinations.ai/prompt/${encoded}?width=1024&height=1024&seed=${seed}&model=flux&nologo=true&enhance=true`;

    await preloadImgWithTimeout(imgUrl,120000);
    loading.remove();

    const imgData={url:imgUrl,prompt:newPrompt,brief:editTxt,createdAt:Date.now(),editOf:idx};
    updateMission(currentMissionId,m2=>{ m2.images.push(imgData); m2.updatedAt=Date.now(); });
    const m2=getMission(currentMissionId);
    renderImageItem(imgData,m2.images.length-1);
    toast('Edit applied');
    toggleEdit(idx,'img');
  } catch(e){
    console.error('Edit error:',e);
    loading.remove();
    toast('Edit failed — try again');
  } finally {
    editInput.disabled=false;
    submitBtn.disabled=false; submitBtn.textContent='APPLY EDIT';
  }
}

function preloadImgWithTimeout(url,ms){
  return new Promise((res,rej)=>{
    const img=new Image();
    // Do NOT set crossOrigin — Pollinations doesn't send CORS headers,
    // setting crossOrigin causes the request to fail silently.
    const timer=setTimeout(()=>{ img.src=''; rej(new Error('Image timed out')); },ms);
    img.onload=()=>{ clearTimeout(timer); res(url); };
    img.onerror=(e)=>{ clearTimeout(timer); rej(new Error('Image failed to load')); };
    img.src=url;
  });
}




// ═══════════════════════════════════════
// UTILITIES
// ═══════════════════════════════════════
function renderImageItemInGroup(img, idx, group){
  const div=document.createElement('div'); div.className='gen-item'; div.id=`img-item-${idx}`;
  div.innerHTML=`
    <img class="gen-item-img" src="${img.url}" alt="Generated image" loading="lazy" onerror="this.style.opacity=0.3;this.alt='Image expired — regenerate'">
    <div class="gen-item-actions">
      <button class="gen-action" onclick="downloadMedia('${escH(img.url)}','inator-image-${idx}.jpg')">↓ SAVE</button>
      <button class="gen-action" onclick="shareMedia('${escH(img.url)}','Generated by INATOR')">↗ SHARE</button>
      <button class="gen-action" onclick="toggleEdit(${idx},'img')">✎ EDIT</button>
    </div>
    <div class="edit-form" id="edit-img-${idx}">
      <textarea class="edit-input" id="edit-input-img-${idx}" placeholder="Describe your edit..."></textarea>
      <button class="edit-submit" onclick="editImage(${idx})">APPLY EDIT</button>
    </div>`;
  group.appendChild(div);
}


function showGenLoading(containerId,msg){
  const container=document.getElementById(containerId);
  const div=document.createElement('div'); div.className='gen-loading';
  div.innerHTML=`<div class="gen-loading-ring"></div><div class="gen-loading-txt">${escH(msg)||'GENERATING...'}</div>`;
  container.prepend(div);
  const panelId='panel-'+containerId.replace('-items','');
  const panel=document.getElementById(panelId);
  if(panel) panel.scrollTo({top:0,behavior:'smooth'});
  return div;
}

function toggleEdit(idx,type){
  const form=document.getElementById(`edit-${type}-${idx}`);
  form.classList.toggle('open');
  if(form.classList.contains('open')) form.querySelector('.edit-input').focus();
}

async function downloadMedia(url,filename){
  try{
    toast('Preparing download...');
    const res=await fetch(url);
    const blob=await res.blob();
    const blobUrl=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=blobUrl; a.download=filename;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(blobUrl),5000);
    toast('Downloaded!');
  } catch(e){
    // Fallback: direct link
    const a=document.createElement('a'); a.href=url; a.download=filename; a.target='_blank';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    toast('Opening download...');
  }
}

async function shareMedia(url,text){
  if(navigator.share){
    try{
      const res=await fetch(url);
      const blob=await res.blob();
      const ext=blob.type.includes('video')?'mp4':'jpg';
      const file=new File([blob],`inator.${ext}`,{type:blob.type});
      await navigator.share({files:[file],text});
      return;
    } catch(e){ /* fall through */ }
    try{ await navigator.share({url,text}); return; } catch(e2){ /* fall through */ }
  }
  copyToClipboard(url);
}

function copyToClipboard(text){
  navigator.clipboard?.writeText(text).then(()=>toast('Link copied!')).catch(()=>toast('Copy failed'));
}

function openModal(id){ document.getElementById(id).classList.add('open'); }
function closeModal(id){ document.getElementById(id).classList.remove('open'); }

function escH(str){ const d=document.createElement('div'); d.textContent=str||''; return d.innerHTML; }

let toastTimer=null;
function toast(msg){
  const el=document.getElementById('toast');
  el.className='toast'+(currentMissionId?' ms-toast':'');
  el.textContent=msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove('show'),2800);
}

// Close modals on overlay tap
document.querySelectorAll('.modal-overlay').forEach(el=>{
  el.addEventListener('click',e=>{ if(e.target===el) el.classList.remove('open'); });
});

// Enter key in modals
document.getElementById('mission-name-input').addEventListener('keydown',e=>{ if(e.key==='Enter') createMission(); });
document.getElementById('rename-input').addEventListener('keydown',e=>{ if(e.key==='Enter') confirmRename(); });

// ═══════════════════════════════════════
// INIT
// ═══════════════════════════════════════
buildStars();
renderMissions();
document.getElementById('bs-input-wrap').style.display='none';
</script>

    navigator.serviceWorker.register('./sw.js');
  }
</script>
